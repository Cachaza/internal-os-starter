# the patched release keeps the same build API used by that loader.
overrides:
  esbuild: ^0.25.4
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6.0.3
  "@types/node": ^26.2.0
  lucide-react: ^1.27.0
  next: ^16.3.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  "@trpc/server": ^11.18.0
  "@trpc/client": ^11.18.0
  better-auth: 1.7.1
  "@tailwindcss/postcss": ^4.3.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.3
