name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: forgejo-ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: internal_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Build-time placeholders satisfy the same validated contract as runtime.
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:password@postgres:5432/internal_os_test
      TEST_DATABASE_URL: postgresql://postgres:password@postgres:5432/internal_os_test
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/pnpm/action-setup@v4
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm test
      - run: pnpm run check-types
      - run: pnpm run db:migrate
      - run: pnpm run test:integration
      - run: pnpm run build
      - run: pnpm run setup:local
      - run: docker compose build
      - run: docker compose config --quiet
